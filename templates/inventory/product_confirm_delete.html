{% extends "base.html" %}
{% block title %}Delete product{% endblock %}
{% block content %}
<div class="delete-wrap"><div class="delete-icon">!</div><h1>Delete this product?</h1><p class="muted">You’re about to remove <strong>{{ product.name }}</strong> (SKU: {{ product.sku }}) from your inventory. This action cannot be undone.</p><form method="post">{% csrf_token %}<a href="{% url 'inventory:list' %}" class="btn btn-light">Keep product</a><button type="submit" class="btn btn-danger">Delete product</button></form></div>
{% endblock %}
